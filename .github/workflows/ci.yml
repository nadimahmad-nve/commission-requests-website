name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          cd backend
          pip install fastapi uvicorn sqlalchemy httpx pytest requests dotenv 

      - name: Run Pytest
        run: |
          cd backend
          python -m pytest

  frontend-tests:
    runs-on: ubuntu-latest 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Node modules
        run: |
          cd frontend
          npm install
          
      - name: Run Vitest
        run: |
          cd frontend
          npx vitest run